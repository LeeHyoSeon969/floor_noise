<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>어떻게 들려요?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101827;
            color: #eef2ff;
            font-family: "맑은 고딕", sans-serif;
            line-height: 1.7;
        }

        main {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.4;
            word-break: keep-all;
        }

        h2 {
            margin-top: 0;
            font-size: 21px;
        }

        .subtitle {
            color: #b8c7df;
        }

        .card {
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #3a4b65;
            border-radius: 20px;
            background: #1b2940;
        }

        button {
            margin: 6px 8px 6px 0;
            padding: 13px 19px;
            border: none;
            border-radius: 12px;
            background: #7ee2c7;
            color: #10251f;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

            button:hover:not(:disabled) {
                background: #aff5e3;
            }

            button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

        #stopButton {
            background: #ffbaba;
        }

        #status {
            min-height: 32px;
            color: #c9d8ee;
            overflow-wrap: anywhere;
        }

        audio {
            display: block;
            width: 100%;
            margin-top: 20px;
        }

        #homeFloor {
            width: 110px;
            margin-left: 12px;
            padding: 10px;
            border: 1px solid #71819a;
            border-radius: 10px;
            background: #101827;
            color: #ffffff;
            font: inherit;
        }

        #floorLabel {
            display: block;
            margin: 24px 0 12px;
            color: #7ee2c7;
            font-size: 23px;
            font-weight: 700;
        }

        #floorSlider {
            width: 100%;
            margin: 20px 0 12px;
            accent-color: #7ee2c7;
            cursor: pointer;
        }

        .floor-ticks {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            color: #bdcbe1;
            font-size: 14px;
        }

        .notice {
            margin-top: 24px;
            padding: 16px;
            border-left: 3px solid #eac481;
            background: #253047;
            color: #eadbbd;
            font-size: 13px;
        }

        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        @media (max-width: 600px) {
            main {
                padding: 24px 16px;
            }

            .card {
                padding: 20px;
            }
        }
        /* 페이지 진입 인트로 */
        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #101827;
            /*
       인트로는 장식이므로 클릭을 막지 않음.
       애니메이션에 문제가 생겨도 버튼을 가로막지 않음.
    */
            pointer-events: none;
            animation: introScreenOut 2.8s ease forwards;
        }

        .intro-content {
            text-align: center;
            animation: introContentInOut 2.8s ease forwards;
        }

        .intro-caption {
            margin: 0 0 18px;
            color: #7ee2c7;
            font-size: 14px;
            letter-spacing: 3px;
        }

        .intro-title {
            margin: 0;
            color: #eef2ff;
            font-size: clamp(38px, 8vw, 72px);
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -2px;
            word-break: keep-all;
        }

        .intro-description {
            margin-top: 22px;
            color: #b8c7df;
            font-size: 15px;
        }

        .intro-line {
            width: 120px;
            height: 3px;
            margin: 30px auto 0;
            border-radius: 999px;
            background: linear-gradient( 90deg, transparent, #7ee2c7, transparent );
            transform-origin: center;
            animation: introLineGrow 1.8s ease forwards;
        }

        /* 글자가 나타나고 잠시 머문 뒤 사라짐 */
        @keyframes introContentInOut {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }

            25% {
                opacity: 1;
                transform: translateY(0);
            }

            70% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* 배경까지 사라지면서 기존 화면이 드러남 */
        @keyframes introScreenOut {
            0%, 70% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes introLineGrow {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* 움직임 최소화 설정을 사용하는 사람에게는 생략 */
        @media (prefers-reduced-motion: reduce) {
            .intro-screen {
                display: none;
                animation: none;
            }

            .intro-content,
            .intro-line {
                animation: none;
            }
        }
    </style>
</head>


<body>
        <!-- 처음 접속할 때 표시되는 인트로 -->
        <div id="introScreen" class="intro-screen" aria-hidden="true">
            <div class="intro-content">
                <p class="intro-caption">우리의 일상, 이웃의 소리</p>

                <h2 class="intro-title">
                    우리집<br>
                    층간소음 측정기
                </h2>

                <p class="intro-description">
                    녹음으로 체험하는 가상 층간소음
                </p>
                <p class="intro-credit">이효선 제작</p>

                <div class="intro-line"></div>
            </div>
        </div>

   
            <!-- 기존 화면은 그대로 유지 -->
            <main>
                <header>
                    <h1>
                        내가 낸 이 소리!<br>
                        아랫집에선 어떻게 들릴까요?
                    </h1>

                    <p class="subtitle">
                        직접 녹음하고, 바를 움직이며 가상의 층별 효과를 비교해보세요.
                    </p>
                </header>

                <section class="card">
                    <h2>1. 소리 녹음하기</h2>

                    <div>
                        <button type="button" id="recordButton">
                            녹음 시작
                        </button>

                        <button type="button" id="stopButton" disabled>
                            녹음 종료
                        </button>
                    </div>

                    <p id="status" role="status" aria-live="polite">
                        코드 준비 중… 이 문구가 계속 보이면 스크립트를 확인해주세요.
                    </p>

                    <audio id="player" controls></audio>
                </section>

                <section class="card">
                    <h2>2. 우리 집은 몇 층인가요?</h2>

                    <div>
                        <label for="homeFloor">거주 층수</label>

                        <input type="number"
                               id="homeFloor"
                               min="1"
                               max="100"
                               step="1"
                               value="10">
                    </div>
                </section>

                <section class="card">
                    <h2>3. 어느 층에서 들어볼까요?</h2>

                    <label for="floorSlider" id="floorLabel">
                        층수 설정 중…
                    </label>

                    <input type="range"
                           id="floorSlider"
                           min="0"
                           max="3"
                           step="0.01"
                           value="0">

                    <div class="floor-ticks" id="floorTicks"></div>

                    <button type="button" id="listenButton" disabled>
                        선택한 위치에서 듣기
                    </button>

                    <p class="subtitle">
                        재생 중 바를 움직이면 효과가 서서히 바뀝니다.
                        일시정지는 위쪽 오디오 플레이어에서 할 수 있어요.
                    </p>

                    <p class="notice">
                        실제 층별 소음 예측이 아닌 가상 체험입니다.
                    </p>
                </section>
            </main>

            <script>
                "use strict";

                // 화면 요소
                const recordButton = document.querySelector("#recordButton");
                const stopButton = document.querySelector("#stopButton");
                const statusText = document.querySelector("#status");
                const player = document.querySelector("#player");

                const homeFloor = document.querySelector("#homeFloor");
                const floorSlider = document.querySelector("#floorSlider");
                const floorLabel = document.querySelector("#floorLabel");
                const floorTicks = document.querySelector("#floorTicks");
                const listenButton = document.querySelector("#listenButton");

                // 녹음 상태
                let recorder = null;
                let microphoneStream = null;
                let soundURL = null;

                // 오디오 처리 상태
                let audioContext = null;
                let audioSource = null;
                let filter = null;
                let volume = null;

                // 실제 측정값이 아닌 가상 체험용 설정
                const floorSettings = [
                { frequency: 18000, gain: 1.0 },
                { frequency: 900, gain: 0.7 },
                { frequency: 550, gain: 0.5 },
                { frequency: 350, gain: 0.35 }
                ];

                function stopMicrophone() {
                if (microphoneStream) {
                microphoneStream.getTracks().forEach(function (track) {
                track.stop();
                });

                microphoneStream = null;
                }
                }

                function restoreButtons() {
                recordButton.disabled = false;
                stopButton.disabled = true;
                listenButton.disabled = !soundURL;
                }

                // 녹음 시작
                async function startRecording() {
                recordButton.disabled = true;
                stopButton.disabled = true;
                listenButton.disabled = true;

                player.pause();
                statusText.textContent = "마이크 사용 권한을 확인하는 중…";

                try {
                if (
                !navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia
                ) {
                throw new Error(
                "현재 환경에서 마이크에 접근할 수 없습니다. " +
                "Chrome 또는 Edge에서 HTTPS나 localhost로 열어주세요."
                );
                }

                if (typeof MediaRecorder === "undefined") {
                throw new Error(
                "현재 브라우저가 MediaRecorder를 지원하지 않습니다."
                );
                }

                microphoneStream =
                await navigator.mediaDevices.getUserMedia({
                audio: true
                });

                const currentStream = microphoneStream;
                const currentRecorder = new MediaRecorder(currentStream);
                const chunks = [];

                recorder = currentRecorder;

                currentRecorder.addEventListener(
                "dataavailable",
                function (event) {
                if (event.data.size > 0) {
                chunks.push(event.data);
                }
                }
                );

                currentRecorder.addEventListener("stop", function () {
                currentStream.getTracks().forEach(function (track) {
                track.stop();
                });

                if (microphoneStream === currentStream) {
                microphoneStream = null;
                }

                try {
                const recording = new Blob(chunks, {
                type: currentRecorder.mimeType
                });

                if (recording.size === 0) {
                throw new Error(
                "녹음 데이터가 없습니다. 다시 시도해주세요."
                );
                }

                if (soundURL) {
                URL.revokeObjectURL(soundURL);
                }

                soundURL = URL.createObjectURL(recording);
                player.src = soundURL;
                player.load();

                statusText.textContent =
                "녹음 완료! 선택한 위치에서 듣기를 눌러주세요.";

                } catch (error) {
                statusText.textContent =
                "녹음 처리 오류: " + error.message;

                console.error(error);

                } finally {
                restoreButtons();
                }
                });

                currentRecorder.addEventListener("error", function (event) {
                statusText.textContent =
                "녹음 장치 오류: " +
                (event.error ? event.error.message : "알 수 없는 오류");

                if (currentRecorder.state !== "inactive") {
                currentRecorder.stop();
                }

                stopMicrophone();
                restoreButtons();
                });

                currentRecorder.start();

                stopButton.disabled = false;
                statusText.textContent = "녹음 중… 소리를 내보세요.";

                } catch (error) {
                stopMicrophone();
                restoreButtons();

                statusText.textContent =
                "녹음 오류: " + error.name + " / " + error.message;

                console.error(error);
                }
                }

                // 녹음 종료
                function stopRecording() {
                if (recorder && recorder.state === "recording") {
                stopButton.disabled = true;
                statusText.textContent = "녹음을 마무리하는 중…";

                recorder.stop();
                }
                }

                // 슬라이더 위치에 해당하는 효과 계산
                function getSoundSettings() {
                const distance = Number(floorSlider.value);

                const lower = Math.floor(distance);
                const upper = Math.min(lower + 1, floorSettings.length - 1);
                const ratio = distance - lower;

                const start = floorSettings[lower];
                const end = floorSettings[upper];

                const frequency =
                start.frequency *
                Math.pow(end.frequency / start.frequency, ratio);

                const gain =
                start.gain + (end.gain - start.gain) * ratio;

                return {
                frequency: frequency,
                gain: gain
                };
                }

                // 소리 처리 경로는 한 번만 생성
                async function prepareAudio() {
                if (!audioContext) {
                const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

                if (!AudioContextClass) {
                throw new Error(
                "현재 브라우저가 Web Audio API를 지원하지 않습니다."
                );
                }

                audioContext = new AudioContextClass();

                audioSource =
                audioContext.createMediaElementSource(player);

                filter = audioContext.createBiquadFilter();
                filter.type = "lowpass";
                filter.Q.value = 0.7;

                volume = audioContext.createGain();

                audioSource.connect(filter);
                filter.connect(volume);
                volume.connect(audioContext.destination);

                const settings = getSoundSettings();

                filter.frequency.value = settings.frequency;
                volume.gain.value = settings.gain;
                }

                await audioContext.resume();
                }

                // 층수 표시 및 효과 변경
                function applyFloor() {
                if (
                homeFloor.value === "" ||
                !homeFloor.validity.valid
                ) {
                floorLabel.textContent =
                "1~100 사이의 정수 층수를 입력해주세요.";
                return;
                }

                const home = Number(homeFloor.value);
                const distance = Number(floorSlider.value);

                const listeningFloor = home - distance;
                const nearestFloor = Math.round(listeningFloor);

                if (Math.abs(listeningFloor - nearestFloor) < 0.005) {
                floorLabel.textContent =
                nearestFloor + "층에서 듣기" +
                (distance === 0
                ? " · 기준 설정"
                : " · 가상 효과");
                } else {
                floorLabel.textContent =
                Math.ceil(listeningFloor) + "층 ↔ " +
                Math.floor(listeningFloor) +
                "층 · 효과 전환 중";
                }

                floorSlider.setAttribute(
                "aria-valuetext",
                floorLabel.textContent
                );

                if (!audioContext || !filter || !volume) {
                return;
                }

                const settings = getSoundSettings();
                const now = audioContext.currentTime;

                filter.frequency.setTargetAtTime(
                settings.frequency,
                now,
                0.08
                );

                volume.gain.setTargetAtTime(
                settings.gain,
                now,
                0.08
                );
                }

                // 거주 층수에 따라 범위와 눈금 갱신
                function updateFloorRange() {
                if (
                homeFloor.value === "" ||
                !homeFloor.validity.valid
                ) {
                floorLabel.textContent =
                "1~100 사이의 정수 층수를 입력해주세요.";
                return;
                }

                const home = Number(homeFloor.value);
                const maxDistance = Math.min(3, home - 1);

                floorSlider.max = String(maxDistance);
                floorSlider.value = String(
                Math.min(Number(floorSlider.value), maxDistance)
                );

                floorSlider.disabled = maxDistance === 0;
                floorTicks.textContent = "";

                for (
                let distance = 0;
                distance <= maxDistance;
                distance++
                ) {
                const tick = document.createElement("span");

                tick.textContent = (home - distance) + "층";
                floorTicks.appendChild(tick);
                }

                applyFloor();
                }

                // 선택한 설정으로 처음부터 재생
                async function playRecording() {
                if (!homeFloor.reportValidity()) {
                return;
                }

                if (!soundURL) {
                statusText.textContent = "먼저 소리를 녹음해주세요.";
                return;
                }

                try {
                await prepareAudio();
                applyFloor();

                player.currentTime = 0;
                await player.play();

                statusText.textContent =
                "재생 중! 바를 움직여 효과를 비교해보세요.";

                } catch (error) {
                statusText.textContent =
                "재생 오류: " + error.name + " / " + error.message;

                console.error(error);
                }
                }

                // 버튼과 동작 연결
                recordButton.addEventListener("click", startRecording);
                stopButton.addEventListener("click", stopRecording);
                listenButton.addEventListener("click", playRecording);

                homeFloor.addEventListener("input", updateFloorRange);
                floorSlider.addEventListener("input", applyFloor);

                player.addEventListener("play", function () {
                if (audioContext) {
                audioContext.resume().catch(console.error);
                }
                });

                // 초기 화면 설정
                updateFloorRange();
                restoreButtons();

                statusText.textContent =
                "준비 완료! 녹음 시작을 눌러주세요.";
            </script>
    </body>
</html>
